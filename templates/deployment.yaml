apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signserver-helm.fullname" . }}
  labels:
    {{- include "signserver-helm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "signserver-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "signserver-helm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "signserver-helm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}  
      initContainers:
        {{- $proxyType := "" }}
        {{- $proxyHost := "" }}
        {{- if and .Values.nginx.enabled (not .Values.nginx.mountInternalNginxCert) (not .Values.nginx.initializeWithSelfSignedTls) }}
          {{- $proxyType = "nginx" }}
          {{- $proxyHost = .Values.nginx.host -}}
        {{- end}}
        {{- if .Values.signserver.initContainers }}
          {{- toYaml .Values.signserver.initContainers | nindent 8 }}
        {{- end }}
      containers:
        {{- if .Values.nginx.enabled }}
        - name: {{ .Chart.Name }}-nginx
          image: {{ .Values.nginx.image }}
          {{- if and .Values.nginx.initializeWithSelfSignedTls (not .Values.nginx.mountInternalNginxCert)}}
          command:
            - "/bin/bash"
            - "-c"
            - |
              mkdir -p /etc/nginx/ssl/pem/
              openssl req -x509 -newkey rsa:4096 -keyout /etc/nginx/ssl/pem/{{ .Values.nginx.host }}-Key.pem -out /etc/nginx/ssl/pem/{{ .Values.nginx.host }}.pem -sha256 -days 7 -nodes -subj '/CN={{ .Values.nginx.host }}-selfsigned'
              nginx -g "daemon off;"
          {{- end }}
          ports:
          {{- if .Values.nginx.service.httpPort }}
            - name: nginx-http
              containerPort: 80
          {{- end }}
            - name: nginx-https
              containerPort: 443
          startupProbe:
            tcpSocket:
              port: 443
          livenessProbe:
            tcpSocket:
              port: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/njs/cert-transform.js
              subPath: cert-transform.js
            {{- if .Values.nginx.mountInternalNginxCert }}
            - name: nginx-cert-provided
              mountPath: /etc/nginx/ssl/pem/
            {{- else }}
            - name: nginx-cert
              mountPath: /etc/nginx/ssl/
            {{- end }}
        {{- end }}
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env: {{- include "signserver-helm.signserverDeploymentParameters" . | nindent 12 }}
            {{- if .Values.services.proxyAJP.enabled }}
            - name: PROXY_AJP_BIND
              value: {{ .Values.services.proxyAJP.bindIP }}
            {{- end }}
            {{- if .Values.services.proxyHttp.enabled }}
            - name: PROXY_HTTP_BIND
              value: {{ .Values.services.proxyHttp.bindIP }}
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command: 
                  - "/bin/sh"
                  - "-c"
                  - |
                    {{- if .Values.signserver.importWorkerProperties }}
                    until [ -f /opt/keyfactor/appserver/standalone/deployments/signserver.ear.deployed ]; do sleep 5; done
                    for FILE in /opt/keyfactor/tmp/workers/*; do /opt/keyfactor/bin/signserver setproperties "$FILE"; done
                    {{- end }}
          ports:
            {{- if .Values.services.directHttp.enabled }}
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
            {{- if .Values.services.proxyAJP.enabled }}
            - name: ajp
              containerPort: 8009
              protocol: TCP
            {{- end }}
            {{- if .Values.services.proxyHttp.enabled }}
            - name: proxy-http
              containerPort: 8081
              protocol: TCP
            - name: proxy-https
              containerPort: 8082
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /signserver/healthcheck/signserverhealth?workerId=none
              {{- if .Values.services.directHttp.enabled }}
              port: http
              {{- else if .Values.services.proxyAJP.enabled }}
              port: 80
              {{- else if .Values.services.proxyHttp.enabled }}
              port: proxy-http
              {{- end }}
              {{- if and (hasKey .Values.signserver "allowedHostnames") (not (empty .Values.signserver.allowedHostnames)) }}
              httpHeaders:
                - name: Host
                  value: {{ first .Values.signserver.allowedHostnames }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.signserver.startup.initialDelaySeconds | default 20 }}
            periodSeconds: {{ .Values.probes.signserver.startup.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.signserver.startup.timeoutSeconds | default 1 }}
            failureThreshold: {{ .Values.probes.signserver.startup.failureThreshold | default 30 }}
          livenessProbe:
            httpGet:
              path: /signserver/healthcheck/signserverhealth?workerId=none
              {{- if .Values.services.directHttp.enabled }}
              port: http
              {{- else if .Values.services.proxyAJP.enabled }}
              port: 80
              {{- else if .Values.services.proxyHttp.enabled }}
              port: proxy-http
              {{- end }}
              {{- if and (hasKey .Values.signserver "allowedHostnames") (not (empty .Values.signserver.allowedHostnames)) }}
              httpHeaders:
                - name: Host
                  value: {{ first .Values.signserver.allowedHostnames }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.signserver.liveness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.signserver.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.signserver.liveness.timeoutSeconds | default 1 }}
            failureThreshold: {{ .Values.probes.signserver.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /signserver/healthcheck/signserverhealth?workerId=none
              {{- if .Values.services.directHttp.enabled }}
              port: http
              {{- else if .Values.services.proxyAJP.enabled }}
              port: 80
              {{- else if .Values.services.proxyHttp.enabled }}
              port: proxy-http
              {{- end }}
              {{- if and (hasKey .Values.signserver "allowedHostnames") (not (empty .Values.signserver.allowedHostnames)) }}
              httpHeaders:
                - name: Host
                  value: {{ first .Values.signserver.allowedHostnames }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.signserver.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.signserver.readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.signserver.readiness.timeoutSeconds | default 1 }}
            failureThreshold: {{ .Values.probes.signserver.readiness.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.signserver.useH2Persistence }}
            - name: signserver-h2-persistence
              mountPath: /mnt/persistent/
            {{- end }}
            {{- if .Values.signserver.importAppserverKeystore }}
            - name: signserver-config-appserver-keystore
              mountPath: /mnt/external/secrets/tls/ks/
            {{- end }}
            {{- if .Values.signserver.importAppserverTruststore }}
            - name: signserver-config-appserver-truststore
              mountPath: /mnt/external/secrets/tls/ts/
            {{- end }}
            {{- if .Values.signserver.importWorkerProperties }}
            - name: signserver-workers-properties-files
              mountPath: /opt/keyfactor/tmp/workers/
            {{- end }}
            {{- if .Values.signserver.importKeystores }}
            - name: signserver-keystores-files
              mountPath: {{ .Values.signserver.keystoresMountPath }}
            {{- end }}
            {{- if .Values.signserver.volumeMounts }}
              {{- toYaml .Values.signserver.volumeMounts | nindent 12 }}
            {{- end }}
          {{- if .Values.signserver.sidecarContainers }}
            {{- toYaml .Values.signserver.sidecarContainers | nindent 8 }}
          {{- end }}
      volumes:
        {{- if .Values.nginx.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "signserver-helm.fullname" . }}-nginx-config
        - name: nginx-cert
          emptyDir: { }
        {{- if .Values.nginx.mountInternalNginxCert }}
        - name: nginx-cert-provided
          secret:
            secretName: {{ .Values.nginx.secretInternalNginxCert }}
        {{- end }}
        {{- end }}
        {{- if .Values.signserver.useH2Persistence }}
        - name: signserver-h2-persistence
          persistentVolumeClaim:
            claimName: {{ .Values.signserver.existingH2PersistenceClaim }}
        {{- end }}
        {{- if .Values.signserver.importAppserverKeystore }}
        - name: signserver-config-appserver-keystore
          secret:
            secretName: {{ .Values.signserver.appserverKeystoreSecret }}
        {{- end }}
        {{- if .Values.signserver.importAppserverTruststore }}
        - name: signserver-config-appserver-truststore
          secret:
            secretName: {{ .Values.signserver.appserverTruststoreSecret }}
        {{- end }}
        {{- if .Values.signserver.importWorkerProperties }}
        - name: signserver-workers-properties-files
          secret:
            secretName: {{ .Values.signserver.workerPropertiesSecret }}
        {{- end }}
        {{- if .Values.signserver.importKeystores }}
        - name: signserver-keystores-files
          secret:
            secretName: {{ .Values.signserver.keystoresSecret }}
        {{- end }}
        {{- if .Values.signserver.volumes }}
          {{- toYaml .Values.signserver.volumes | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
