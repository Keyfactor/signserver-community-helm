stages:
  - lint
  - package
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "fb-DSS-3823-introduce-pipeline" #testing purposes
    - if: $CI_COMMIT_TAG
    - when: never

variables:
  KUBERNETES_NODE_SELECTOR_ARCH: 'kubernetes.io/arch=amd64'
  JFROG_REGISTRY: $CI_REGISTRY_NAME
  JFROG_USERNAME: $CI_REGISTRY_USER
  JFROG_PASSWORD: $CI_REGISTRY_PASSWORD

default:
  image:
    name: keyfactor.jfrog.io/dockerhub/library/alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  tags:
    - ci-prod
  before_script:
    - echo "Setting up Helm"
    - apk add helm
    - echo "Setting up Make"
    - apk add make

lint-chart:
  stage: lint
  script:
    - helm lint . --debug

.package-helm:
  stage: package
  script:
    - make "$MAKE_TARGET"
  artifacts:
    paths:
      - "$ARTIFACT_PATH"

package-helm-ee:
  extends: .package-helm
  variables:
    MAKE_TARGET: package-helm-ee
    ARTIFACT_PATH: signserver-*.tgz

package-helm-ce:
  extends: .package-helm
  when: manual
  variables:
    MAKE_TARGET: package-helm-ce
    ARTIFACT_PATH: signserver-ce-*.tgz

.publish-helm:
  stage: publish
  script:
    - echo "Publishing chart to registry $CI_REGISTRY with username $CI_REGISTRY_USER"
    - $CI_REGISTRY_PASSWORD | helm registry login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - make "$MAKE_TARGET"

publish-helm-ee:
  extends: .publish-helm
  when: manual
  needs:
    - job: package-helm-ee
      artifacts: true
  variables:
    MAKE_TARGET: publish-helm-ee

publish-helm-ce:
  extends: .publish-helm
  when: manual
  needs:
    - job: package-helm-ce
      artifacts: true
  variables:
    MAKE_TARGET: publish-helm-ce


