stages:
  - validate
  - package
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "fb-DSS-3823-introduce-pipeline" #testing purposes
    - if: $CI_COMMIT_TAG
    - when: never

variables:
  JFROG_REGISTRY: $CI_REGISTRY_NAME
  JFROG_USERNAME: $CI_REGISTRY_USER
  JFROG_PASSWORD: $CI_REGISTRY_PASSWORD

.prepare-env:
  image:
    name: keyfactor.jfrog.io/dockerhub/library/alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  before_script:
    - echo "Setting up Helm"
    - apk add --no-cache helm
    - echo "Setting up Make"
    - apk add make

validate-chart:
  extends: .prepare-env
  stage: validate
  script:
    - helm lint . --debug

.package-helm:
  extends: .prepare-env
  stage: package
  script:
    - make "$MAKE_TARGET"
  artifacts:
    paths:
      - "$ARTIFACT_PATH"

.publish-helm:
  extends: .prepare-env
  stage: publish
  script:
    - helm registry login "$JFROG_REGISTRY" --username "$JFROG_USERNAME" --password "$JFROG_PASSWORD"
    - make "$MAKE_TARGET"

package-helm-ee:
  extends: .package-helm
  variables:
    MAKE_TARGET: package-helm-ee
    ARTIFACT_PATH: signserver-*.tgz

package-helm-ce:
  extends: .package-helm
  when: manual
  variables:
    MAKE_TARGET: package-helm-ce
    ARTIFACT_PATH: signserver-ce-*.tgz

publish-helm-ee:
  extends: .publish-helm
  when: manual
  needs:
    - job: package-helm-ee
      artifacts: true
  variables:
    MAKE_TARGET: publish-helm-ee

publish-helm-ce:
  extends: .publish-helm
  when: manual
  needs:
    - job: package-helm-ce
      artifacts: true
  variables:
    MAKE_TARGET: publish-helm-ce


