stages:
  - lint
  - package
  - publish

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_REF_NAME == "fb-DSS-3823-introduce-pipeline" #testing purposes
    - when: never

variables:
  KUBERNETES_NODE_SELECTOR_ARCH: 'kubernetes.io/arch=amd64'

default:
  image:
    name: keyfactor.jfrog.io/dockerhub/library/alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  tags:
    - ci-prod
  before_script:
    - echo "Installing helm"
    - apk add helm
    - echo "Installing make"
    - apk add make

lint-chart:
  stage: lint
  script:
    - helm lint . --debug

.package-helm:
  stage: package
  script:
    - make "$MAKE_TARGET"
  artifacts:
    paths:
      - "$ARTIFACT_PATH"

package-helm-ee:
  extends: .package-helm
  variables:
    MAKE_TARGET: package-helm-ee
    GIT_TAG: ""
    COMMIT_SHORT_SHA: ""
    ARTIFACT_PATH: signserver-*.tgz
  script:
    - |
      if [[ $CI_COMMIT_TAG ]]; then
          GIT_TAG=${CI_COMMIT_TAG#v}
      elif [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        COMMIT_SHORT_SHA=mr.$CI_MERGE_REQUEST_IID.$CI_COMMIT_SHORT_SHA
      elif [[ $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH ]]; then
        COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
      elif [[ $CI_COMMIT_REF_NAME == "fb-DSS-3823-introduce-pipeline" ]]; then 
        COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
      fi
    - echo "Building chart with tag $GIT_TAG and commit short SHA $COMMIT_SHORT_SHA"
    - make package-helm-ee GIT_TAG="$GIT_TAG" COMMIT_SHORT_SHA="$COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

package-helm-ce:
  extends: .package-helm
  variables:
    MAKE_TARGET: package-helm-ce
    ARTIFACT_PATH: signserver-ce-*.tgz
  when: manual

.publish-helm:
  stage: publish
  script:
    - echo "Publishing chart to registry $CI_REGISTRY with username $CI_REGISTRY_USER"
    - $CI_REGISTRY_PASSWORD | helm registry login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - make "$MAKE_TARGET"

publish-helm-ee:
  extends: .publish-helm
  needs:
    - job: package-helm-ee
      artifacts: true
  variables:
    MAKE_TARGET: publish-helm-ee
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

publish-helm-ce:
  extends: .publish-helm
  needs:
    - job: package-helm-ce
      artifacts: true
  variables:
    MAKE_TARGET: publish-helm-ce
  when: manual
